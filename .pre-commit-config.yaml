# Local hooks deliberately use `language: system` + `uv run` rather than
# mirrors-mypy. mirrors-mypy runs in an isolated virtualenv containing only what
# additional_dependencies lists, so type-checking code that imports langchain,
# langgraph, pydantic, httpx and rich would mean duplicating the entire runtime
# dependency list into this file -- a second copy uv.lock knows nothing about,
# which drifts until the hook and CI disagree about what the type errors are.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: debug-statements
      # Not boilerplate here: this project's subject is credential files, and
      # tests/ is not gitignored. The numbered practice labs plant DELIBERATELY
      # fake keys/secrets as loot, so they are excluded from this one hook.
      - id: detect-private-key
        exclude: ^labs/[0-9]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: forbid-submodules

  - repo: local
    hooks:
      # pass_filenames: false throughout -- mypy needs the whole package for
      # cross-module inference, and isort rules need to see every import block.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # ruff has no file-length rule; this caps module size (functions are capped
      # by ruff's PLR09xx/C901). pass_filenames: false -- it scans fixed roots.
      - id: file-size
        name: file size cap
        entry: uv run python scripts/check_file_size.py
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # On push only: the suite builds FAISS indexes and opens sqlite savers, and
      # a slow pre-commit hook is a hook people start bypassing.
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-push]
