[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skuggi"
dynamic = ["version"]
description = "Locally-hosted LangGraph agent harness with a planner-worker-critic loop"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jan Schupke", email = "jan.schupke@gmail.com" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Current majors. Capped at the next major so a breaking bump is a resolver
    # error rather than a silent break -- the failure mode this repo already had
    # (declared langgraph~=0.2 against an installed 0.6.11).
    "langchain>=1.4.2,<2",
    "langchain-core>=1.6.4,<2",
    "langchain-openai>=1.6.5,<2",
    "langchain-anthropic>=1.7.4,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-text-splitters>=1.1.2,<2",
    # community still ships 0.x; it is the line aligned with core 1.x.
    "langchain-community>=0.4.2,<0.5",
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    # >=1.12 is load-bearing: cp314 wheels first appear in 1.12.0, so an older
    # floor makes 3.13/3.14 attempt a source build needing SWIG and a BLAS.
    "faiss-cpu>=1.12",
    # rich ships breaking majors (13 -> 15 here) and the TUI depends
    # structurally on Live/Markdown/Table rendering.
    "rich>=15,<16",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.9",
    # Reads .env itself (via dotenv internally), so python-dotenv is no longer
    # a direct dependency.
    "pydantic-settings>=2.15",
    "httpx>=0.28",
]

[project.scripts]
skuggi = "skuggi.shell:main"
skuggi-repl = "skuggi.__main__:main"
skuggi-ingest = "skuggi.ingest:main"
skuggi-doctor = "skuggi.doctor:main"
skuggi-client = "skuggi.client:main"

[tool.hatch.version]
path = "src/skuggi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skuggi"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    # Tight minor pin: pydantic's mypy plugin imports deep mypy internals, so a
    # local run and a CI run must never disagree about which mypy found what.
    "mypy>=2.3.1,<2.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    # Two tests (the bounded tool loop, the huge-exponent guard) would hang
    # rather than fail if their cap regressed. A hanging job is worse than a red one.
    "pytest-timeout>=2.4",
    "respx>=0.23.1",
    "pre-commit>=4.6.2",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # The eval layer talks to real providers; it is opt-in only.
    "-m", "not eval",
    "--cov=skuggi",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
xfail_strict = true
filterwarnings = [
    "error",
    # langgraph.checkpoint.base emits this at import time; not actionable here.
    "ignore:The default value of .allowed_objects. will change:",
    # langchain-community is sunset-announced but still shipping releases
    # (0.4.2, aligned with core 1.x) and there is no official standalone FAISS
    # integration to move to -- langchain-faiss on PyPI is an unrelated
    # third-party upload. Revisit when langchain-ai publishes a replacement.
    "ignore:.langchain-community. is being sunset:DeprecationWarning",
]
markers = [
    "eval: talks to a real LLM provider; needs credentials, deselected by default",
    "slow: builds a real FAISS index or exercises the sqlite saver end to end",
    "mock_http: drives a mocked HTTP transport; the blanket network block is lifted",
    "runs_commands: spawns a real subprocess; the blanket subprocess block is lifted",
]

[tool.coverage.run]
source = ["src/skuggi"]
branch = true
# __main__ is the thin REPL entry point. Elsewhere the interactive plumbing that
# needs a real terminal/socket -- shell.main, daemon.serve, client.run/main -- is
# marked `# pragma: no cover`, while its pure core (build_shell_invocation,
# Daemon.handle_request, client.run_over) is unit tested.
omit = ["src/skuggi/__main__.py"]

[tool.coverage.report]
show_missing = true
# Measured at 93% with branch coverage; 90 leaves headroom for a refactor
# without letting the graph or tool logic rot uncovered.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F", "E", "W",      # pyflakes, pycodestyle
    "I",                # isort
    "N",                # pep8-naming
    "D",                # pydocstyle
    "UP",               # pyupgrade
    "ANN",              # annotations
    "S",                # bandit
    "BLE",              # blind except
    "B",                # bugbear
    "A",                # builtin shadowing
    "C4",               # comprehensions
    "DTZ",              # naive datetimes
    "T20",              # print
    "EM",               # exception messages
    "ISC",              # implicit str concat
    "PIE", "PT", "RET", "SIM", "SLF", "TID", "ARG", "PTH",
    "ERA",              # commented-out code
    "PL",               # pylint
    "TRY",              # tryceratops
    "FLY", "PERF", "FURB", "LOG", "G",
    "RUF",
]
ignore = [
    "D105",    # magic methods need no prose
    "D107",    # __init__ is documented on the class
    "ISC001",  # conflicts with the formatter
    # TC001-003 move annotation-only imports into TYPE_CHECKING blocks. That is
    # unsafe here: langgraph resolves AgentState with get_type_hints() at build
    # time and LangChain builds tool schemas from annotations at runtime, so a
    # gated import becomes a NameError. TC004/TC006 stay on.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# CodexChatModel is a pydantic model; its field annotations are evaluated at
# runtime, so an import moved into TYPE_CHECKING breaks class construction.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "langchain_core.language_models.BaseChatModel",
]

[tool.ruff.lint.per-file-ignores]
"src/skuggi/__init__.py" = ["D104"]
"src/skuggi/ingest.py" = ["T201"]          # print() is this module's output
# The shell launcher and the thin client print directly to the operator's tty.
"src/skuggi/client.py" = ["T201"]
# _get_request_payload's **kwargs: Any is fixed by the ChatOpenAI signature.
"src/skuggi/codex_chat.py" = ["ANN401"]
# The shell launcher and the daemon's socket server import their heavy/platform
# plumbing lazily inside the interactive functions, so importing the module for
# its unit-tested helpers stays cheap. shell.main prints to the operator's tty.
"src/skuggi/shell.py" = ["PLC0415", "T201"]
"src/skuggi/daemon.py" = ["PLC0415"]
"tests/**" = [
    "S101",             # asserts are the point
    "S105", "S106",     # fake tokens in fixtures
    "D100", "D103",     # the test name is the documentation
    "PLR2004",          # `assert n == 42` is not a magic value
    "SLF001",           # tests legitimately inspect private helpers
    "ARG001",           # fixtures requested for a side effect
    "ARG002",           # fake methods match a real signature they don't all use
    "D102",             # the test or fake method name is the documentation
    # Test helpers take heterogeneous kwargs to forward into a real constructor.
    "ANN401",
]
# The fakes subclass BaseChatModel, so their overrides must keep the base
# signature (unused stop/run_manager, **kwargs: Any), and their mutable
# defaults are pydantic fields, which pydantic copies per instance.
"tests/fakes.py" = ["ARG002", "ANN401", "RUF012"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
# tests/ is a real package (it has several conftest.py files and tests import
# tests.fakes by name), which is what keeps those module names distinct.
plugins = ["pydantic.mypy"]
warn_unreachable = true
extra_checks = true
enable_error_code = [
    # Makes a bare `# type: ignore` an error, so every suppression names a code.
    "ignore-without-code",
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
pretty = true

[tool.pydantic-mypy]
# Left off deliberately: ChatOpenAI and OpenAIEmbeddings take aliased
# constructor arguments (model -> model_name, api_key -> openai_api_key), which
# the plugin cannot see, so enabling this rejects every documented call.
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = true
