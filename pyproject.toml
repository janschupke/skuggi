[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skuggi"
dynamic = ["version"]
description = "Locally-hosted LangGraph agent harness with a planner-worker-critic loop"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jan Schupke", email = "jan.schupke@gmail.com" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Current majors. Capped at the next major so a breaking bump is a resolver
    # error rather than a silent break -- the failure mode this repo already had
    # (declared langgraph~=0.2 against an installed 0.6.11).
    "langchain>=1.4.2,<2",
    "langchain-core>=1.6.4,<2",
    "langchain-openai>=1.6.5,<2",
    "langchain-anthropic>=1.7.4,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-text-splitters>=1.1.2,<2",
    # community still ships 0.x; it is the line aligned with core 1.x.
    "langchain-community>=0.4.2,<0.5",
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    # >=1.12 is load-bearing: cp314 wheels first appear in 1.12.0, so an older
    # floor makes 3.13/3.14 attempt a source build needing SWIG and a BLAS.
    "faiss-cpu>=1.12",
    # rich ships breaking majors (13 -> 15 here) and the TUI depends
    # structurally on Live/Markdown/Table rendering.
    "rich>=15,<16",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.9",
    # Reads .env itself (via dotenv internally), so python-dotenv is no longer
    # a direct dependency.
    "pydantic-settings>=2.15",
    "httpx>=0.28",
]

# The MD -> HTML -> PDF report pipeline (skuggi-pdf and `/report pdf`). Optional so
# the core agent installs without WeasyPrint's native Pango dependency, and an
# EXTRA rather than a dependency-group because it has to reach a global install:
# `uv tool install` has no --group flag of any kind, so a group can only ever
# populate a dev checkout and `skuggi-pdf` would be broken for every operator who
# installed skuggi as a command. `make install` and CI pass --all-extras, so the
# gate still exercises it.
# WeasyPrint needs a system Pango: `brew install pango` / `apt install libpango-1.0-0`.
[project.optional-dependencies]
pdf = [
    "weasyprint>=63",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "jinja2>=3.1",
]

[project.scripts]
skuggi = "skuggi.shell:main"
skuggi-repl = "skuggi.__main__:main"
skuggi-init = "skuggi.init:main"
skuggi-ingest = "skuggi.ingest:main"
skuggi-doctor = "skuggi.doctor:main"
skuggi-client = "skuggi.client:main"
skuggi-pdf = "skuggi.pdf:main"
skuggi-eval = "skuggi.eval.cli:main"

[tool.hatch.version]
path = "src/skuggi/__init__.py"

[tool.hatch.build.targets.wheel]
# Includes src/skuggi/templates/ -- the report stylesheet and the `*.example.json`
# config templates `skuggi-init` seeds the config home from. Those templates live
# inside the package rather than at ./configs so that BOTH install shapes can read
# them: a wheel has no repo to look in, and an editable install resolves
# `importlib.resources` to this source tree, which a build-time include would not
# have populated.
packages = ["src/skuggi"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    # Tight minor pin: pydantic's mypy plugin imports deep mypy internals, so a
    # local run and a CI run must never disagree about which mypy found what.
    "mypy>=2.3.1,<2.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    # Two tests (the bounded tool loop, the huge-exponent guard) would hang
    # rather than fail if their cap regressed. A hanging job is worse than a red one.
    "pytest-timeout>=2.4",
    "respx>=0.23.1",
    "pre-commit>=4.6.2",
]
eval = [
    "autoevals>=0.3,<1",
    "braintrust>=0.42,<1",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# The lab-range controller lives outside the shipped package (labs/_lib), so its
# unit tests import it from there. It is deliberately excluded from --cov=skuggi.
pythonpath = ["labs/_lib"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # The eval layer talks to real providers and the e2e layer drives the real
    # pipeline against the docker lab; both are opt-in only.
    "-m", "not eval and not e2e",
    "--cov=skuggi",
    "--cov-branch",
    "--cov-fail-under=90",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
xfail_strict = true
filterwarnings = [
    "error",
    # langgraph.checkpoint.base emits this at import time; not actionable here.
    "ignore:The default value of .allowed_objects. will change:",
    # langchain-community is sunset-announced but still shipping releases
    # (0.4.2, aligned with core 1.x) and there is no official standalone FAISS
    # integration to move to -- langchain-faiss on PyPI is an unrelated
    # third-party upload. Revisit when langchain-ai publishes a replacement.
    "ignore:.langchain-community. is being sunset:DeprecationWarning",
]
markers = [
    "eval: talks to a real LLM provider; needs credentials, deselected by default",
    "e2e: drives the real pipeline against the docker lab; needs the lab up, deselected by default",
    "mock_http: drives a mocked HTTP transport; the blanket network block is lifted",
    "runs_commands: spawns a real subprocess; the blanket subprocess block is lifted",
]

[tool.coverage.run]
source = ["src/skuggi"]
branch = true
# __main__ is the thin REPL entry point. Elsewhere the interactive plumbing that
# needs a real terminal/socket -- shell.main, daemon.serve, client.run/main -- is
# marked `# pragma: no cover`, while its pure core (build_shell_invocation,
# Daemon.handle_request, client.run_over) is unit tested.
omit = ["src/skuggi/__main__.py"]

[tool.coverage.report]
show_missing = true
# Measured at 93% with branch coverage; 90 leaves headroom for a refactor
# without letting the graph or tool logic rot uncovered.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "labs/_lib"]
# The numbered lab dirs hold deliberately-insecure app code (PHP/JS/Go/Python);
# linting them is meaningless and would fail on purpose. The controller
# (labs/_lib, labs/labctl) is still linted.
extend-exclude = ["labs/*-*", "labs/_common"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F", "E", "W",      # pyflakes, pycodestyle
    "I",                # isort
    "N",                # pep8-naming
    "D",                # pydocstyle
    "UP",               # pyupgrade
    "ANN",              # annotations
    "S",                # bandit
    "BLE",              # blind except
    "B",                # bugbear
    "A",                # builtin shadowing
    "C4",               # comprehensions
    "DTZ",              # naive datetimes
    "T20",              # print
    "EM",               # exception messages
    "ISC",              # implicit str concat
    "PIE", "PT", "RET", "SIM", "SLF", "TID", "ARG", "PTH",
    "ERA",              # commented-out code
    "PL",               # pylint
    "TRY",              # tryceratops
    "FLY", "PERF", "FURB", "LOG", "G",
    "RUF",
]
ignore = [
    "D105",    # magic methods need no prose
    "D107",    # __init__ is documented on the class
    "ISC001",  # conflicts with the formatter
    # TC001-003 move annotation-only imports into TYPE_CHECKING blocks. That is
    # unsafe here: langgraph resolves AgentState with get_type_hints() at build
    # time and LangChain builds tool schemas from annotations at runtime, so a
    # gated import becomes a NameError. TC004/TC006 stay on.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# CodexChatModel is a pydantic model; its field annotations are evaluated at
# runtime, so an import moved into TYPE_CHECKING breaks class construction.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "langchain_core.language_models.BaseChatModel",
]

[tool.ruff.lint.per-file-ignores]
"src/skuggi/__init__.py" = ["D104"]
# The boot guard prints its one actionable line straight to the operator's tty.
"src/skuggi/boot.py" = ["T201"]
"src/skuggi/ingest.py" = ["T201"]          # print() is this module's output
# skuggi-init reports what it seeded/migrated to the operator's tty.
"src/skuggi/init.py" = ["T201"]
# The shell launcher and the thin client print directly to the operator's tty.
"src/skuggi/client.py" = ["T201"]
# _get_request_payload's **kwargs: Any is fixed by the ChatOpenAI signature.
"src/skuggi/codex_chat.py" = ["ANN401"]
# The offline eval model subclasses BaseChatModel (with_structured_output /
# _generate carry the base's Any signatures); the quality scorers match
# Braintrust's untyped (output, metadata, **kwargs) score-function contract.
"src/skuggi/eval/offline.py" = ["ANN401", "ARG002"]
# skuggi-eval prints its scorecard to stdout.
"src/skuggi/eval/cli.py" = ["T201"]
"src/skuggi/eval/quality.py" = ["ANN401"]
# The shell launcher and the daemon's socket server import their heavy/platform
# plumbing lazily inside the interactive functions, so importing the module for
# its unit-tested helpers stays cheap. shell.main prints to the operator's tty.
"src/skuggi/shell.py" = ["PLC0415", "T201"]
"src/skuggi/daemon.py" = ["PLC0415"]
# WeasyPrint is imported lazily inside the render function (native dep, kept out
# of the import graph for the core agent); the CLI prints its result to the tty.
"src/skuggi/pdf.py" = ["PLC0415", "T201"]
# reports.write_report imports skuggi.pdf lazily so the PDF deps stay optional.
"src/skuggi/reports.py" = ["PLC0415"]
# The lab-range controller renders its tables/prompts straight to the operator's
# tty, and shells out to `docker compose` with a fixed argv (shell=False).
"labs/_lib/labctl/cli.py" = ["T201"]
"labs/_lib/labctl/compose.py" = ["S603", "S607"]
"tests/**" = [
    "S101",             # asserts are the point
    "S105", "S106",     # fake tokens in fixtures
    "D100", "D103",     # the test name is the documentation
    "PLR2004",          # `assert n == 42` is not a magic value
    "SLF001",           # tests legitimately inspect private helpers
    "ARG001",           # fixtures requested for a side effect
    "ARG002",           # fake methods match a real signature they don't all use
    "D102",             # the test or fake method name is the documentation
    # Test helpers take heterogeneous kwargs to forward into a real constructor.
    "ANN401",
]
# The fakes subclass BaseChatModel, so their overrides must keep the base
# signature (unused stop/run_manager, **kwargs: Any), and their mutable
# defaults are pydantic fields, which pydantic copies per instance.
"tests/fakes.py" = ["ARG002", "ANN401", "RUF012"]

[tool.mypy]
python_version = "3.12"
# labs/_lib holds the standalone lab-range controller (labctl); the numbered lab
# build contexts under labs/*-*/ are intentionally-vulnerable app code and are
# NOT typechecked. mypy_path lets `import labctl` (from src-free labs/_lib) resolve.
files = ["src", "tests", "labs/_lib"]
mypy_path = "labs/_lib"
strict = true
# tests/ is a real package (it has several conftest.py files and tests import
# tests.fakes by name), which is what keeps those module names distinct.
plugins = ["pydantic.mypy"]
warn_unreachable = true
extra_checks = true
enable_error_code = [
    # Makes a bare `# type: ignore` an error, so every suppression names a code.
    "ignore-without-code",
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
pretty = true

[tool.pydantic-mypy]
# Left off deliberately: ChatOpenAI and OpenAIEmbeddings take aliased
# constructor arguments (model -> model_name, api_key -> openai_api_key), which
# the plugin cannot see, so enabling this rejects every documented call.
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = true

# WeasyPrint and Pygments ship no type information, so a strict run cannot
# follow them. Scoped to those two; markdown-it-py, mdit-py-plugins, jinja2 and
# markupsafe are all typed.
[[tool.mypy.overrides]]
module = ["weasyprint.*", "pygments.*"]
ignore_missing_imports = true

# autoevals (the LLM-judge scorers for the quality eval tier) ships no type
# information; braintrust itself is typed. Scoped to autoevals only.
[[tool.mypy.overrides]]
module = ["autoevals.*"]
ignore_missing_imports = true
