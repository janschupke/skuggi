<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # Indexes on: /backup/, /uploads/ are browsable — realistic recon surface.
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Combined log records the User-Agent, enabling the LFI -> log-poisoning
    # RCE path. Kept at a path www-data can read (see entrypoint.sh).
    CustomLog /var/log/apache2/access.log combined
    ErrorLog  /var/log/apache2/error.log
</VirtualHost>
