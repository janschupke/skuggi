name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      # --frozen: a stale uv.lock is a red build, not a silently drifting env.
      - run: uv sync --frozen --all-groups --all-extras
      - run: uv run ruff check --output-format=github
      # --check, never the rewriting formatter: CI reports, it does not fix.
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor and what mypy targets; 3.14 is the dev interpreter;
        # 3.13 is included because skipping the middle version is how you learn
        # about a 3.13-only break from a user instead of from CI.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # WeasyPrint (the `pdf` group) links Pango at runtime; without it the PDF
      # render test would skip and the pipeline would go unverified.
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --all-groups --all-extras --python ${{ matrix.python }}
      # The eval layer is deselected by default, so no credentials are needed
      # and the suite must pass on a machine that has none.
      - run: uv run --python ${{ matrix.python }} pytest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  e2e:
    name: e2e (docker lab)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups --all-extras
      # Bring the frozen e2e fixture target up (separate from the user-facing
      # labs/ range). On the Linux runner the lab-net bridge is directly
      # routable, so both the loopback and the 192.0.2.10 cases run.
      - run: cp tests/e2e/fixtures/lab/.env.example tests/e2e/fixtures/lab/.env
      - run: docker compose -f tests/e2e/fixtures/lab/docker-compose.yml up -d --build --wait
      # --no-cov: a partial selection would trip the global --cov-fail-under=90.
      - run: uv run pytest -m e2e --no-cov
      - if: always()
        run: docker compose -f tests/e2e/fixtures/lab/docker-compose.yml down -v
