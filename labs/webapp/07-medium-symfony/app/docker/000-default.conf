<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        AllowOverride All
        Require all granted
        # Route every non-file request to the Symfony front controller even if
        # mod_rewrite is unavailable.
        FallbackResource /index.php
    </Directory>

    # Never serve the secrets dir or app internals (they live outside docroot
    # anyway; this is belt-and-braces).
    <Directory /var/secrets>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
