# QuickDesk (easy) — plain PHP/Apache helpdesk on MariaDB.
# ┌─ SAFETY ──────────────────────────────────────────────────────────────────┐
# │ INTENTIONALLY insecure. Loopback-published only. Never expose this.        │
# └─────────────────────────────────────────────────────────────────────────────┘
name: skuggi-webapp-01

networks:
  quickdesk-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.1.0/24
          gateway: 10.20.1.1

volumes:
  dbdata:

services:
  db:
    image: mariadb:11
    container_name: skuggi-webapp-01-db
    hostname: db.quickdesk.lab
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root-quickdesk-2024
      MARIADB_DATABASE: quickdesk
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/seed:/docker-entrypoint-initdb.d:ro
    networks:
      quickdesk-net:
        ipv4_address: 10.20.1.10

  app:
    build: ./app
    image: skuggi-webapp-01-app
    container_name: skuggi-webapp-01-app
    hostname: app.quickdesk.lab
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: quickdesk
      DB_USER: quickdesk_app
      DB_PASS: app-db-pw-2024
    depends_on:
      - db
    ports:
      - "127.0.0.1:8501:80"
    networks:
      quickdesk-net:
        ipv4_address: 10.20.1.20
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health.php"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
