# Ledgerline API (medium) — Go retail-payments gateway with logic flaws.
# ┌─ SAFETY ──────────────────────────────────────────────────────────────────┐
# │ INTENTIONALLY insecure. Loopback-published only. Never expose this.        │
# └─────────────────────────────────────────────────────────────────────────────┘
name: skuggi-lab-05

networks:
  ledgerline-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.5.0/24
          gateway: 10.13.5.1

services:
  api:
    build: ./api
    image: skuggi-lab-05-api
    container_name: skuggi-05-api
    hostname: api.ledgerline.lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:8105:8080"
    networks:
      ledgerline-net:
        ipv4_address: 10.13.5.20
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
