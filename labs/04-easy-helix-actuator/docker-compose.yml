# Helix Admin (easy) — Spring Boot portal with a fully-exposed actuator.
# ┌─ SAFETY ──────────────────────────────────────────────────────────────────┐
# │ INTENTIONALLY insecure. Loopback-published only. Never expose this.        │
# └─────────────────────────────────────────────────────────────────────────────┘
name: skuggi-lab-04

networks:
  helix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.4.0/24
          gateway: 10.13.4.1

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: skuggi-04-postgres
    hostname: db.helix.lab
    restart: unless-stopped
    environment:
      POSTGRES_DB: helix
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: H3lix-DB-Prod-2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:8304:5432"
    networks:
      helix-net:
        ipv4_address: 10.13.4.30

  app:
    build: ./app
    image: skuggi-lab-04-app
    container_name: skuggi-04-app
    hostname: portal.helix.lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:8104:8080"
    networks:
      helix-net:
        ipv4_address: 10.13.4.20
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
