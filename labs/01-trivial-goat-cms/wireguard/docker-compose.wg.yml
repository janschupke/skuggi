# WireGuard reachability overlay (OPTIONAL — macOS by-IP convenience).
#
# You do NOT need this to run lab 01. The lab's scope authorises loopback, so on
# macOS the supported path is simply the published port: http://127.0.0.1:8101
# (skuggi reaches it, the engagement guard allows it). On Linux the bridge is
# directly routable and you do not need this either.
#
# This overlay exists only if you want to hit the lab's in-network address
# (192.0.2.10) BY IP from the macOS host, since Docker Desktop does not route to
# container IPs. It joins a WireGuard gateway to the lab network and hands your
# host a client config whose AllowedIPs route 192.0.2.0/24 through the tunnel.
#
#   docker compose -f docker-compose.yml -f wireguard/docker-compose.wg.yml up -d
#
# Caveat: bringing it up pulls a THIRD-PARTY image from lscr.io (LinuxServer.io),
# the one non-local image in the range — it needs network and can rate-limit or
# fail. If it does, use the loopback path above instead. The image is pinned by
# digest below for reproducibility (resolved from :latest on 2026-10-02).
#
# The generated client config appears at wireguard/config/peer1/peer1.conf.
# Import it into the WireGuard app on the host, activate it, then skuggi can
# nmap/curl/sqlmap 192.0.2.10 directly.
name: skuggi-lab-01

services:
  wg-gw:
    image: lscr.io/linuxserver/wireguard:latest@sha256:216ca1ce9da7bfe26fb752111d952487804bd18933bbd4794970d424bf8adfe9
    container_name: skuggi-01-wg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=127.0.0.1          # host connects via the loopback-published port
      - SERVERPORT=${WG_PORT:-51820}
      - PEERS=${WG_PEERS:-1}
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=192.0.2.0/24       # what the client routes through the tunnel
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "127.0.0.1:${WG_PORT:-51820}:51820/udp"
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    networks:
      lab-net:
        ipv4_address: 192.0.2.2
    restart: unless-stopped
