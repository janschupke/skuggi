[global]
   workgroup = NORTHWIND
   server string = Northwind File Server
   security = user
   map to guest = Bad User
   guest account = nobody
   server min protocol = SMB2
   smb ports = 445
   log level = 1

[public]
   comment = Public share
   path = /srv/samba/public
   browseable = yes
   read only = yes
   guest ok = yes
   force user = nobody
